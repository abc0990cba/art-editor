schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Boundary: OpenSpec owns behavior contracts (what the product does, SHALL/scenarios).
  Durable technical truth (how it works, why it was built this way) lives in docs/ —
  see docs/README.md (architecture/, decisions/, modules/).
  When archiving a change, promote its durable design decisions from design.md into
  docs/decisions/ ADRs and update the affected docs/modules/ pages.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
